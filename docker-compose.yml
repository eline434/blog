# Local development database only. Production uses Neon through Vercel.
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '54329:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bachelorlog
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
